name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install openpyxl markdown

      - name: Generate portal data
        run: |
          python tools/sync_access.py
          python tools/sync_data.py
          python tools/build_docs.py

      - name: Prepare Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist/data
          cp index.html pages-dist/
          cp index.html pages-dist/404.html
          cp -r css js vendor admin docs pages-dist/
          cp data/access-config.js pages-dist/data/
          cp data/portal-data.js pages-dist/data/
          ACCESS_PATH=$(python -c "import json; print(json.load(open('config/access.json', encoding='utf-8'))['accessPath'].strip('/'))")
          mkdir -p "pages-dist/${ACCESS_PATH}"
          cp index.html "pages-dist/${ACCESS_PATH}/index.html"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
